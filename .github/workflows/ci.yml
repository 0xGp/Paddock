name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck packages and video
        run: pnpm typecheck
      - name: Typecheck web
        run: pnpm --filter web exec tsc --noEmit
      - name: Lint web
        run: pnpm --filter web lint
      - name: Unit tests (live Mainnet tests skip without keys)
        run: pnpm test
